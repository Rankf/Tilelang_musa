[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-perf-collector"
version = "0.1.0"
description = "Evidence-preserving TileLang-MUSA offline and runtime performance collection"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
